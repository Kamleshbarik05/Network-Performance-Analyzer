apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-frontend
  template:
    metadata:
      labels:
        app: telemetry-frontend
    spec:
      containers:
      - name: frontend
        image: telemetry-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-frontend
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: telemetry-frontend
